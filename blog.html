<head>

  <!-- Social share preview (LinkedIn, Twitter/X, Slack) -->

  <meta property="og:site_name" content="Hemalatha Yalamanchi" />
  <meta property="og:title" content="Blog — Hemalatha Yalamanchi" />
  <meta property="og:description" content="Writing on AI/ML and data science across the industries that shape daily life — healthcare and finance." />
  <meta property="og:url" content="https://hyalamanchi.github.io/blog.html" />
  <meta property="og:image" content="https://hyalamanchi.github.io/assets/og/site.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blog — Hemalatha Yalamanchi" />
  <meta name="twitter:description" content="Writing on AI/ML and data science across the industries that shape daily life — healthcare and finance." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site-header" id="top">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">HY<span>.</span></a>
      <div class="nav__actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
          <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        </button>
        <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
          <span></span><span></span><span></span>
        </button>
      </div>
      <ul class="nav__menu" id="nav-menu">
        <li><a href="index.html#about" class="nav__link">About</a></li>
        <li><a href="index.html#experience" class="nav__link">Experience</a></li>
        <li><a href="index.html#projects" class="nav__link">Projects</a></li>
        <li><a href="index.html#achievements" class="nav__link">Achievements</a></li>
        <li><a href="blog.html" class="nav__link is-active">Blog</a></li>
        <li><a href="index.html#contact" class="nav__link nav__link--cta">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Hero banner (artwork: assets/blog-hero.png, generated by scripts/gen-blog-hero.py) -->
    <section class="blog-hero">
      <div class="container blog-hero__inner">
        <h1 class="blog-hero__title reveal">Blog</h1>
        <p class="blog-hero__lead reveal">
          Notes on AI/ML and data science across the industries that shape daily life —
          healthcare and finance — and on taking models from notebook to production.
        </p>
      </div>
    </section>

    <section class="section container">
      <!-- Single-post view (used when ?p=<slug> is in the URL) -->
      <article class="post" id="post-view"></article>

      <!-- List view (card grid) -->
      <div id="post-list"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p>© <span id="year"></span> Hemalatha Yalamanchi. Built with care.</p>
      <a href="#top" class="link">Back to top ↑</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
